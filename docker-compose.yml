# Запуск:  cp .env.example .env && nano .env && docker compose up -d --build
# HTTPS (Caddy) вмикається профілем:  docker compose --profile https up -d
services:
  worker:
    build: .
    command: ["tenderwatch", "daemon"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
      - ./rules.toml:/config/rules.toml:ro
    environment:
      RULES_PATH: /config/rules.toml
    healthcheck:
      # воркер живий, якщо БД оновлювалась (kv «job:search») недавно — детальна перевірка у /api/health
      test: ["CMD", "python", "-c", "import sqlite3,os;sqlite3.connect(os.environ['DB_PATH']).execute('select 1')"]
      interval: 60s
      timeout: 10s
      retries: 3

  web:
    build: .
    command: ["tenderwatch", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file: .env
    depends_on: [worker]
    volumes:
      - data:/data
      - ./rules.toml:/config/rules.toml:ro
    environment:
      RULES_PATH: /config/rules.toml
    ports:
      - "127.0.0.1:8000:8000"     # назовні — лише через Caddy або SSH-тунель
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
